name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: retailflow-backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: retailflow-backend/package-lock.json }
      - run: npm ci
      - name: Syntax check every backend file
        run: find app.js server.js src -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: npm test
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: retailflow-frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: retailflow-frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
